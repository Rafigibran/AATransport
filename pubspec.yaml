name: haluna_travel
description: Haluna Travel - Car booking app with Supabase backend and WhatsApp confirmation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  supabase_flutter: ^2.5.0
  url_launcher: ^6.3.0

dependency_overrides:
  # app_links 6.4.1 is incompatible with the Flutter 3.24.3 Android/Gradle template.
  app_links: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
